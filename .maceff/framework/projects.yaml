# OrchardMacEff v0.3.0 Project Configuration
#
# Defines Orchard project with repositories and data mounts
# See framework/README.md for Project Layer (Layer 3 CLAUDE.md) details

projects:
  Orchard:
    # Project context file (Layer 3 CLAUDE.md)
    # Copied to /shared_workspace/Orchard/CLAUDE.md
    # Path relative to .maceff/framework/ root
    context: projects/Orchard_context.md

    # Git repositories to clone
    # Cloned to /shared_workspace/Orchard/repos/{name}
    repos:
      - url: git@github.com:ExampleOrg/orchard-data.git
        path: repos/orchard-data
      - url: git@github.com:ExampleOrg/orchard-core.git
        path: repos/orchard-core
      - url: git@github.com:ExampleOrg/orchard-nnlib.git
        path: repos/orchard-nnlib
      - url: git@github.com:ExampleOrg/orchard-present-android.git
        path: repos/orchard-present-android
      - url: git@github.com:cversek/python-super-utils.git
        path: repos/super-utils

    # Data mount points
    # Dropbox reference data (read-only)
    data_mounts:
      - type: bind
        source: /dropbox_Exampleorg2
        target: data
        read_only: true
