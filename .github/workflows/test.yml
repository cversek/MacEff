name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: macf/pyproject.toml

      - name: Install package with test dependencies
        # `proxy` too: the proxy tests import aiohttp, which lives in that extra,
        # so with [test] alone they could never pass in CI.
        # `amail` is here because the amail suite imports the crypto backend.
        # Without it those tests would SKIP rather than fail, and a silently
        # skipped security suite is the quietest way to stop testing something.
        run: pip install -e "./macf[test,proxy,amail]"

      - name: Create CI environment directories
        run: mkdir -p ~/.claude/projects

      - name: Run tests (hermetic)
        run: >
          pytest macf/tests/ -v --tb=short -m "not live"
          --ignore=macf/tests/test_recommend.py
          --ignore=macf/tests/test_hybrid_search.py
          --ignore=macf/tests/test_lancedb_search.py
          --ignore=macf/tests/test_search_service.py
          --ignore=macf/tests/test_env_cli.py
          --ignore=macf/tests/test_get_token_info.py
          --ignore=macf/tests/test_handle_session_start.py
        timeout-minutes: 3

      - name: Run tests (live external state)
        # MEASURED on this runner, not predicted: 26 passed, 7 skipped. The
        # image does ship tmux, so most of this set genuinely executes here;
        # what stays skipped is systemd-analyze, the real claude client, and
        # the Telegram-credential tests pending GH #330.
        #
        # The step must be INVOKED regardless of how much of it skips: a step
        # that is never run cannot fail, which is a different thing from a
        # suite that passed.
        run: >
          pytest macf/tests/ -v --tb=short -m "live"
          --ignore=macf/tests/test_recommend.py
          --ignore=macf/tests/test_hybrid_search.py
          --ignore=macf/tests/test_lancedb_search.py
          --ignore=macf/tests/test_search_service.py
          --ignore=macf/tests/test_env_cli.py
          --ignore=macf/tests/test_get_token_info.py
          --ignore=macf/tests/test_handle_session_start.py
        timeout-minutes: 2

  style:
    # The gate `ruff.toml` describes as blocking. It was configured, scripted,
    # and invoked by nothing: ruff lives in the `lint` extra, which the test job
    # does not install, and the pre-commit hook that the config credits runs
    # OPSEC, identity and silent-exception checks but never these. So `F821`
    # and `E722` held at zero by nobody's enforcement.
    #
    # It belongs in CI rather than only in a hook because `.git/hooks/` is not
    # versioned -- it is per-clone, so no claim of the form "enforced repo-wide
    # by a git hook" can be true of any repository. CI is where every clone
    # meets the same gate.
    #
    # Cheap enough to run unmatrixed: these are syntactic checks, and their
    # answer does not vary by interpreter version.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the linter
        run: pip install -e "./macf[lint]"

      - name: Blocking rules (must stay at zero)
        # F821 caught five real latent NameErrors on its first run, including
        # four in hook handlers that fire on every tool call -- where an
        # undefined name is a session-wide failure, not a local one.
        run: ruff check . --select F821,E722

      - name: Style ratchet (counts must not grow)
        run: tools/style_check.py
