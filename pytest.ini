[pytest]
# testpaths exists so that a bare `pytest` from the repo root collects exactly
# what CI collects. Before this file there was no pytest configuration anywhere,
# and the Makefile and the CI workflow each named `macf/tests/` explicitly. That
# is why two directories of tests sat unrun for nine months without anyone
# noticing: nobody runs bare pytest, so nothing ever collected them, and the
# green CI run was green about a subset it had chosen by hand.
#
# The point is not convenience. It removes the gap between "the tests" and "the
# tests someone remembered to name".
testpaths = macf/tests

markers =
    live_telegram_config: test's subject IS Telegram config resolution; opts out
        of the autouse fixture that refuses live credentials (see GH #330).
    live: outcome is decided by the machine's live external state (a tmux
        binary/server, a systemd-analyze binary, a real `claude` client, or
        live-credential resolution) rather than by the code under test alone.
        Run the fast, hermetic set with `pytest -m "not live"` (this is what
        `make test` runs); run this set deliberately with `pytest -m live`
        (`make test-live`) on a machine that actually has the dependency —
        most of it legitimately skips where the dependency is absent (e.g.
        CI, which has no tmux/systemd-analyze/claude and refuses live
        Telegram credentials by default).
