[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macf"
version = "0.5.1-dev"
description = "MACF consciousness infrastructure tools"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Craig Versek" }]
dependencies = [
    "PyYAML>=6.0.0",  # Required for task system YAML parsing
    "pydantic>=2.0.0",  # Core: task/agent/project model validation, imported at CLI startup
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "click>=8.0.0",
    "PyYAML>=6.0.0",
    "psutil>=5.9.0",  # For performance testing
    "pydantic>=2.0.0",  # For agent/project spec validation tests
    "lancedb>=0.26.0",  # For hybrid search / recommend tests
    "tomli>=2.0.0; python_version < '3.11'",  # pyproject introspection in test_ci_extras_coverage (tomllib is 3.11+)
    "PyJWT>=2.0.0",  # the ingest receiver imports it at module scope; its drain-coupling logic is under test
]
viz = [
    "markdown>=3.0",  # Markdown-to-HTML for CA presentation
]
lint = [
    # The style gate in tools/lint_staged.sh, configured by ruff.toml at the
    # repo root. DECLARED rather than installed ambiently: a tool a gate depends
    # on and nothing records is undeclared state, and the gate refuses to run
    # rather than skip when it is absent — so a missing ruff blocks commits
    # instead of silently disabling the check.
    "ruff>=0.6",
]
proxy = [
    "aiohttp>=3.9.0",  # For API proxy streaming
]
completion = [
    "argcomplete>=3.0.0",  # Shell tab completion for macf_tools CLI
]
recommend = [
    "sentence-transformers>=2.2.0",  # For semantic embeddings
    "lancedb>=0.26.0",               # For vector similarity and hybrid search
    # "sqlite-vec>=0.1.0",           # DEPRECATED: ARM64 broken, 12-month stale
]
# RECOMMENDED, not merely optional. Without it `macf.amail` refuses to import:
# since amail v1.1, inbound handling is built on verifying signatures and
# classifying what that verification proved, and running without a backend would
# classify every message as unverified while appearing to work. A capability
# that is off is honest; one that is present-but-hollow is not.
amail = [
    "cryptography>=40.0.0",  # Ed25519 per-correspondent authorship signing
]

[project.scripts]
macf_tools = "macf.cli:main"     # fastest startup (direct Python)

# amail's long-running processes. They are package modules, so a deployment
# that installs macf editable from a bind mount gets code changes on restart
# rather than on rebuild. Provisioning invokes them as `python -m` so the
# interpreter is named explicitly and no execute bit is load-bearing; these
# names exist for an operator running them by hand.
amail-broker = "macf.amail.daemons.broker:main"
amail-inbound = "macf.amail.daemons.inbound:main"
amail-receiver = "macf.amail.daemons.receiver:main"
